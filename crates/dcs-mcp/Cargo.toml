[package]
name = "dcs-mcp"
description = "Evaluate Lua inside a running DCS World: the MCP server, the installer and the CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dcs-eval = { path = "../dcs-eval" }
# The MCP server SDK. Only the server half is wanted: no client, and only the
# stdio transport, because stdio is the one transport a user's client speaks to
# this binary over.
rmcp = { version = "3.4", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
] }
# The runtime rmcp's transport is written against. One current-thread runtime
# is enough: the server's work is a handful of file reads per call. `time` is
# not for this crate's own code but for rmcp's shutdown, which puts a timeout
# around the last of the session and panics on a runtime without timers.
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
# Not this crate's own data format. The tool macros demand both derives on
# every parameter struct: `Deserialize` to read a call's arguments off the
# wire, `JsonSchema` to publish the shape a client fills them in from. rmcp
# resolves both crates already, so naming them here adds a line to this file
# and nothing to the build.
serde = { version = "1", features = ["derive"] }
schemars = "1"
# The run record's format, and the one crate here the binary links for its
# own sake rather than the SDK's. The alternative is hand-rolled escaping of
# a Windows path into a JSON string, which goes wrong quietly and only for
# somebody whose profile carries an unusual character. rmcp resolves this
# already, so naming it adds a line to this file and nothing to the build.
serde_json = "1"

[dev-dependencies]
# The stand-in executor, so a test can play the executor's side of the wire
# without DCS.
dcs-eval = { path = "../dcs-eval", features = ["standin"] }
# The client half of the SDK, for the tests that drive a real MCP session over
# an in-memory pair. A dev-dependency and not a dependency: a plain
# `cargo build` resolves none of these, so the shipped binary links no client.
rmcp = { version = "3.4", default-features = false, features = ["client"] }
# The drivers those tests need beyond the server's own: `macros` for
# `#[tokio::test]`, `io-util` for the duplex pair the two halves of a session
# speak over, and `test-util` for the paused clock the idle control measures
# its silence against — sixty seconds of a runtime's own clock, rather than
# two real minutes of CI spent measuring the machine.
tokio = { version = "1", features = [
    "rt",
    "time",
    "macros",
    "io-util",
    "test-util",
] }
